name: Backend checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:backend:style
      - run: npm test
      - run: npm run build

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/Test-GoldisDatabase.ps1

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate

  commission-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: services/commission-engine/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/commission-engine/requirements.lock
      - run: python -m pip check
      - run: python -m unittest discover -s services/commission-engine/tests -v
      - run: python -m venv .audit-venv
      - run: .audit-venv/bin/python -m pip install pip-audit==2.9.0
      - run: .audit-venv/bin/python -m pip_audit --disable-pip --no-deps -r services/commission-engine/requirements.lock

  browser-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_LIVE_PORTALS: '0'
      GOLDIS_ENRICHMENT_PROVIDER: disabled
      GOLDIS_EMAIL_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:fixture
